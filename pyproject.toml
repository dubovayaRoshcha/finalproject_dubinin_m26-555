[project]
name = "finalproject-dubinin-m26-555"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DubininVV", email = "vadimdub@inbox.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = "."

[tool.valutatrade]
users_path = "data/users.json"
portfolios_path = "data/portfolios.json"
rates_path = "data/rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
log_path = "logs/actions.log"
log_format = "text"